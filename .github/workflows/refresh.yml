name: Refresh ARAM snapshot

# Manual trigger only — click "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

# Allow the job to commit the regenerated snapshot back to the repo.
permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # match_cache/ is committed to the repo (match JSON is immutable), so it
      # arrives with the checkout — no API re-fetch for already-seen matches.
      - name: Regenerate snapshot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error::RIOT_API_KEY secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          python aram_snapshot.py

      - name: Commit & push if snapshot or cache changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.js match_cache
          if git diff --cached --quiet; then
            echo "No change in snapshot.js or match_cache — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh ARAM snapshot + cache [skip ci]"
          git push
